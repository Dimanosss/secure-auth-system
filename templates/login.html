{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4 shadow-sm">
        <h3 class="mb-3">Вхід у систему</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Увійти</button>
        </form>
        <a href="{{ url_for('google_login') }}" class="btn btn-outline-danger w-100 mb-3">Увійти через Google (OIDC)</a>
        <div class="text-center">
            <a href="{{ url_for('forgot_password') }}">Забули пароль?</a>
        </div>
    </div>
</div>
{% endblock %}
