{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4 shadow-sm">
        <h4>Новий пароль</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Введіть новий пароль</label>
                <input type="password" name="password" class="form-control" required>
                <small class="text-muted">Мінімум 8 символів, велика/мала літери, цифра, спецсимвол.</small>
            </div>
            <button type="submit" class="btn btn-success w-100">Зберегти пароль</button>
        </form>
    </div>
</div>
{% endblock %}
