{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4 shadow-sm">
        <h4>Відновлення пароля</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Введіть ваш Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Надіслати посилання</button>
        </form>
    </div>
</div>
{% endblock %}
