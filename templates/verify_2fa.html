{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 card p-4 shadow-sm text-center">
        <h4>Двофакторна автентифікація</h4>
        <p class="text-muted">Введіть 6-значний код із додатку Google Authenticator / Authy</p>
        <form method="POST">
            <input type="text" name="otp_code" class="form-control text-center mb-3" maxlength="6" placeholder="000000" required>
            <button type="submit" class="btn btn-success w-100">Підтвердити</button>
        </form>
    </div>
</div>
{% endblock %}
